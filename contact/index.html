<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Studio</title>
  <meta name="description" content="Websites, local search, and social for med spas and independent businesses.">
  <meta property="og:title" content="Contact — Studio">
  <meta property="og:description" content="Websites, local search, and social for med spas and independent businesses.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script type="module" src="../assets/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <site-header active=""></site-header>

  <main id="main">
    <section class="page-hero">
      <div class="page-hero__bg"><img src="../assets/img/hero-contact.jpg" alt="Office space" width="1280" height="600"></div>
      <div class="container">
        <h1 data-reveal>Contact</h1>
        <p class="lead" data-reveal>We’d love to hear from you! Reach out for any questions, inquiries, or to start working together on your next project.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="form-box surface" data-reveal>
          <h4>Get in touch</h4>
          <p>Fill out the form below and our team will get back to you as soon as possible. Let's create something amazing together!</p>
          <!-- Paste your form endpoint into data-endpoint (e.g. https://formspree.io/f/xxxx) -->
          <form class="form" data-contact data-endpoint="" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" placeholder="Jane Smith" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="jane@framer.com" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Your message..." required></textarea>
            </div>
            <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
            <button class="btn btn--primary btn--block" type="submit">Submit</button>
            <p class="form__status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

  </main>

  <site-footer></site-footer>
</body>
</html>
